<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saté Ria</title>
  <!--
    GitHub Pages serves this file for any unknown path. Because the site uses
    hash-based routing, we redirect to index.html and preserve the intended
    hash so deep links / refreshes always land correctly.
  -->
  <script>
    (function () {
      var base = location.pathname.replace(/[^/]*$/, ""); // dir of 404.html
      var hash = location.hash || "";
      location.replace(base + "index.html" + hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=index.html" />
</head>
<body>
  <p>Redirecting to <a href="index.html">Saté Ria</a>…</p>
</body>
</html>
